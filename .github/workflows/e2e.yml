name: e2e

# Real fresh-machine installs (`chezmoi init --apply`) - minutes each and network-heavy, so
# NOT on every push. Only when something that changes what gets installed moves:
#   bootstrap/update scripts, chezmoi config/data/ignore, mise manifests, the Claude plugin
#   list (the bootstrap renders its ids from claude-settings.json), the sheldon plugin list
#   (the bootstrap clones them), and this file.
# Plus weekly: every mise tool is `latest`, so an upstream release can break a fresh install
# with no commit here at all.
on:
  push:
    branches: [main]
    paths: &install-paths
      - 'run_*'
      - '.chezmoi*'
      - '.chezmoitemplates/**'   # `*` stops at `/`, so '.chezmoi*' alone misses this dir
      - 'dot_config/mise/**'
      - 'dot_config/sheldon/**'
      - 'dot_claude/modify_settings.json'
      - '.github/workflows/e2e.yml'
  pull_request:
    paths: *install-paths
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# mise resolves `latest` and downloads github:/aqua: tools through the GitHub API. Unauthenticated
# that is 60 requests/hour PER IP, and hosted runners share IPs: macOS runs died mid-install on
# "API rate limit exceeded". The job token (read-only, per `permissions` above) lifts it to
# 5000/hour; mise and gh both pick GITHUB_TOKEN up from the environment.
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ubuntu-24.04-arm stands in for the Raspberry Pi: it is the only job that catches a mise
  # tool with no linux-arm64 release asset.
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install chezmoi
        run: |
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Fresh install (chezmoi init --apply from this commit)
        # --promptDefaults => tools=true, develop=false, wm=false.
        # wm stays off so yabai/skhd (GUI/SIP, impossible in CI) are skipped.
        run: chezmoi init --apply --source "$PWD" --promptDefaults --no-tty
      - name: Manual step (zsh as login shell + re-login)
        # Run 1 is stage 1 only (.chezmoitemplates/bootstrap-ready): it waits for $SHELL = zsh.
        # The runner's shell is bash, so set what a re-login after chsh would.
        run: echo "SHELL=$(command -v zsh)" >> "$GITHUB_ENV"
      - name: Stage 2 apply (the user's second `chezmoi apply`)
        run: chezmoi apply --source "$PWD"
      - name: Third apply (what the next `cza` does on a fresh box)
        # The bootstrap's `claude plugin marketplace add` rewrites a new marketplace's entry in
        # the managed ~/.claude/settings.json and drops its `autoUpdate` - first run only (the
        # adds are skipped once registered). This apply restores the file; the bootstrap must
        # NOT re-run (unchanged fingerprint), so verify below also proves the setup converges.
        run: chezmoi apply --force --source "$PWD"
      - name: Verify $HOME matches the repo
        # verify alone exits 1 with no output; name what drifted before failing. Scripts excluded:
        # a run_after_ script (Windows: 15-git-bash-path) runs on EVERY apply, so it always shows
        # as pending — that's by design, not drift.
        run: |
          chezmoi verify --source "$PWD" --exclude scripts && exit 0
          chezmoi status --source "$PWD" --exclude scripts
          chezmoi diff --source "$PWD" --exclude scripts | head -200
          exit 1

  # The steps run in pwsh on purpose: chezmoi then launches the WinPS 5.1 bootstrap from a
  # pwsh parent, the PSModulePath leak the bootstrap guards against.
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install chezmoi
        shell: pwsh
        run: |
          $bin = Join-Path $HOME '.local\bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          iex "&{$(irm 'https://get.chezmoi.io/ps1')} -b '$bin'"
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - name: Fresh install (chezmoi init --apply from this commit)
        # --promptDefaults => tools=true, develop=false, wm=false.
        shell: pwsh
        run: chezmoi init --apply --source "$env:GITHUB_WORKSPACE" --promptDefaults --no-tty
      - name: Manual step (a new terminal)
        # Run 1 is stage 1 only (.chezmoitemplates/bootstrap-ready): it waits for the User-scope
        # SCOOP it persisted, which only a new terminal sees.
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_ENV -Value "SCOOP=$([Environment]::GetEnvironmentVariable('SCOOP', 'User'))"
      - name: Stage 2 apply (the user's second `chezmoi apply`)
        shell: pwsh
        run: chezmoi apply --source "$env:GITHUB_WORKSPACE"
      - name: Third apply (what the next `cza` does on a fresh box)
        # See the e2e job: marketplace add drops `autoUpdate` from settings.json on first run.
        shell: pwsh
        run: chezmoi apply --force --source "$env:GITHUB_WORKSPACE"
      - name: Verify $HOME matches the repo
        shell: pwsh
        run: |
          chezmoi verify --source "$env:GITHUB_WORKSPACE" --exclude scripts
          if ($LASTEXITCODE -eq 0) { exit 0 }
          chezmoi status --source "$env:GITHUB_WORKSPACE" --exclude scripts
          chezmoi diff --source "$env:GITHUB_WORKSPACE" --exclude scripts | Select-Object -First 200
          exit 1
