# starship — prompt config (Windows only; Unix uses powerlevel10k).
# Minimal: directory + branch + duration, colours from the ANSI palette below so it follows the
# terminal theme. No git_status: it runs `git status` every prompt (~55ms of a ~170ms prompt on
# Windows, measured); the branch name is free (read from .git/HEAD).
#
# scan_timeout: the default 30ms is marginal on Windows. starship globs the CWD once per prompt;
# a cold FS cache (+ Defender) after boot blows 30ms and prints
#   [WARN] - (starship::context): Scanning current directory timed out.
# It is a CEILING, not a cost (warm scan ~1ms).
scan_timeout = 500
# No blank line before the prompt (default true) — it also left an empty first row in a new pane.
add_newline = false
palette = 'ansi'
"$schema" = 'https://starship.rs/config-schema.json'

# username/hostname only render over SSH.
format = """
$username\
$hostname\
$directory\
$git_branch\
$cmd_duration\
$line_break\
$character"""

[directory]
style = "blue"

[git_branch]
format = "[$branch]($style) "
style = "muted"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[character]
success_symbol = "[❯](accent)"
error_symbol = "[❯](red)"

[palettes.ansi]
accent = "purple"
red = "red"
yellow = "yellow"
blue = "blue"
muted = "bright-black"
