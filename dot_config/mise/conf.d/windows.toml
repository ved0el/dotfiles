# Windows-specific mise tools — applied only on Windows (gated in .chezmoiignore).
# For a CROSS-PLATFORM tool that needs a different backend here (eza: the registry default is a
# cargo source build). A tool only Windows uses at all goes to scoop instead (part 1 bootstrap).
#
# Ad-hoc, machine-specific additions go in ~/.config/mise/config.toml — that file is
# NOT managed by chezmoi, and `mise use -g` writes there by default, so
# experiments never pollute these tracked files.
[tools]
"aqua:eza-community/eza" = "latest"   # eza prebuilt binary (macOS/Linux use plain `eza`)
