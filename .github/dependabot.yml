# The only pinned dependency in this repo is actions/checkout (by SHA). Dependabot reads
# the `# vX.Y.Z` comment next to each SHA pin and bumps both when a release lands.
# Monthly + one group = at most one PR a month. Everything else floats on purpose
# (mise `latest`, scoop/brew/apt), so there is nothing for a bot to track there.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
