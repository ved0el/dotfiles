name: test

# main + PRs only: pushing a PR branch used to run everything twice (push AND pull_request).
# Docs-only commits (README/CLAUDE.md, most of this repo's history) skip CI entirely.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

# Least privilege: this workflow only reads the repo. Override per-job if a step
# ever needs more.
permissions:
  contents: read

# A newer push to the same ref makes the running one pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback: templates render + dry-run, no package installs. Gates the e2e jobs.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install chezmoi
        run: |
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Init config from this commit (renders .chezmoi.toml.tmpl with defaults)
        run: chezmoi init --source "$PWD" --promptDefaults --no-tty
      - name: Bootstrap scripts render cleanly (sh + ps1)
        run: |
          chezmoi execute-template --source "$PWD" < run_onchange_after_install-packages.sh.tmpl
          chezmoi execute-template --source "$PWD" < run_onchange_after_install-packages.ps1.tmpl
      - name: Dry-run apply (no changes made)
        run: chezmoi apply --dry-run --source "$PWD"

  # End-to-end: actually runs the bootstrap on clean runners (fresh-machine test).
  # ubuntu-24.04-arm stands in for the Raspberry Pi: it is the only job that catches a mise
  # tool with no linux-arm64 release asset.
  e2e:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install chezmoi
        run: |
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Fresh install (chezmoi init --apply from this commit)
        # --promptDefaults => tools=true, develop=false, tmux=true, wm=false.
        # wm stays off so yabai/skhd (GUI/SIP, impossible in CI) are skipped.
        run: chezmoi init --apply --source "$PWD" --promptDefaults --no-tty
      - name: Verify $HOME matches the repo
        # verify alone exits 1 with no output; name what drifted before failing.
        run: |
          chezmoi verify --source "$PWD" && exit 0
          chezmoi status --source "$PWD"
          chezmoi diff --source "$PWD" | head -200
          exit 1

  # End-to-end on Windows: scoop + mise bootstrap on a clean runner (fresh-machine test).
  # The steps run in pwsh on purpose: chezmoi then launches the WinPS 5.1 bootstrap from a
  # pwsh parent, the PSModulePath leak the bootstrap guards against.
  e2e-windows:
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install chezmoi
        shell: pwsh
        run: |
          $bin = Join-Path $HOME '.local\bin'
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          iex "&{$(irm 'https://get.chezmoi.io/ps1')} -b '$bin'"
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - name: Fresh install (chezmoi init --apply from this commit)
        # --promptDefaults => tools=true, develop=false. tmux/wm are Windows-skipped.
        shell: pwsh
        run: chezmoi init --apply --source "$env:GITHUB_WORKSPACE" --promptDefaults --no-tty
      - name: Verify $HOME matches the repo
        shell: pwsh
        run: |
          chezmoi verify --source "$env:GITHUB_WORKSPACE"
          if ($LASTEXITCODE -eq 0) { exit 0 }
          chezmoi status --source "$env:GITHUB_WORKSPACE"
          chezmoi diff --source "$env:GITHUB_WORKSPACE" | Select-Object -First 200
          exit 1
