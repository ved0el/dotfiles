# Develop profile — language runtimes, managed by mise.
# Linked to ~/.config/mise/conf.d/develop.toml; `mise install` (base profile hook)
# installs everything declared here. Adjust the list/versions to taste.
[tools]
node = "lts"
python = "latest"
go = "latest"
bun = "latest"
pnpm = "latest"
uv = "latest"
# npm backend: needs node (above). If a fresh box's first `mise install` races it, the bootstrap
# reports the failure and the next `chezmoi apply` installs it.
"npm:cf" = "latest"
