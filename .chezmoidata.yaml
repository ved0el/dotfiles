# Default profile selection (so templates render even before `chezmoi init`).
# `chezmoi init` runs .chezmoi.toml.tmpl and writes per-machine data that
# OVERRIDES these defaults. Per-machine overrides live in ~/.config/chezmoi/chezmoi.toml.
tools: true     # CLI tools via mise
develop: false  # language runtimes via mise
tmux: false     # Linux only, optional: tmux + TPM plugins and ~/.tmux.conf (herdr is the default multiplexer)
scoopDir: ""    # Windows: SCOOP root (prompted; "" = bootstrap default ~/.local/share/scoop)
miseDataDir: "" # Windows: MISE_DATA_DIR (prompted; "" = bootstrap default ~/.local/share/mise)
sshd: false     # Windows: this box is an SSH server (scoop no_junction + one-time reset)
claudeServer: false # Linux/Windows SSH server: herdr + claude remote-control start at boot (Claude reachable from claude.ai/app)
wm: false       # tiling WM: macOS yabai+skhd / Windows komorebi+whkd+yasb (off on Linux)
apps: false     # essential GUI apps from appList (each OS's own package manager)
# The `apps` profile's list, per OS: winget ids / brew casks. Essentials only — everything else
# is installed by hand. Linux has no list: Tailscale + Brave Origin come from their vendor repos
# (not in Debian's own apt), set up in run_onchange_after_10-install-packages.sh.tmpl.
appList:
  windows: [Tailscale.Tailscale, Brave.Brave, Flow-Launcher.Flow-Launcher, ShareX.ShareX, RamenSoftware.Windhawk]
  darwin: [tailscale-app, brave-browser]
# Brave ~ Brave Origin (the paid build without the extras; Linux installs brave-origin itself) with
# no telemetry. Browser policies set by the `apps` profile on Windows (HKLM) and macOS (defaults).
# Shields and the privacy features stay. bool = feature switch, int = enum policy.
bravePolicy:
  # what Brave Origin removes
  BraveRewardsDisabled: true
  BraveWalletDisabled: true
  BraveVPNDisabled: true
  BraveNewsDisabled: true
  BraveTalkDisabled: true
  TorDisabled: true
  BraveAIChatEnabled: false
  BraveLocalAIEnabled: false
  BravePlaylistEnabled: false
  BraveSpeedreaderEnabled: false
  BraveWaybackMachineEnabled: false
  BraveWebDiscoveryEnabled: false
  EmailAliasesEnabled: false
  IPFSEnabled: false
  # telemetry: Origin's (stats ping, P3A, crash/usage reports) + Chromium's remaining reporters
  BraveStatsPingEnabled: false
  BraveP3AEnabled: false
  MetricsReportingEnabled: false
  UrlKeyedAnonymizedDataCollectionEnabled: false
  SafeBrowsingExtendedReportingEnabled: false
  DomainReliabilityAllowed: false        # network-error reports to Google
  SpellCheckServiceEnabled: false        # cloud spellcheck (sends typed text)
  AlternateErrorPagesEnabled: false      # "similar page" lookups on errors
  UserFeedbackAllowed: false
  FeedbackSurveysEnabled: false
  WebRtcEventLogCollectionAllowed: false
  PromotionsEnabled: false
  ShoppingListEnabled: false
  NetworkPredictionOptions: 2            # no prefetch/preconnect
  BackgroundModeEnabled: false           # nothing left running after the last window closes
